name: Skia SDK Daily

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/skia-sdk-daily.yml"
      - "scripts/skia/**"
  workflow_dispatch:
  schedule:
    - cron: "22 19 * * *"

permissions:
  contents: read

jobs:
  build-skia-sdk:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x64
            runner: ubuntu-latest
          - platform: macos
            arch: arm64
            runner: macos-14
          - platform: windows
            arch: x64
            runner: windows-latest

    steps:
      - name: Checkout ReactCpp
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            libfontconfig1-dev \
            libfreetype-dev \
            libgl1-mesa-dev \
            libharfbuzz-dev \
            pkg-config \
            python3 \
            python3-venv

      - name: Install macOS dependencies
        if: matrix.platform == 'macos'
        run: |
          brew install pkg-config

      - name: Build ReactCpp Skia SDK
        shell: bash
        run: |
          python scripts/skia/build_skia_sdk.py \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --sdk-root "$PWD/.reactcpp/skia-sdk" \
            --archive "$PWD/reactcpp-skia-sdk-${{ matrix.platform }}-${{ matrix.arch }}.zip"

      - name: Upload Skia SDK
        uses: actions/upload-artifact@v4
        with:
          name: reactcpp-skia-sdk-${{ matrix.platform }}-${{ matrix.arch }}
          path: reactcpp-skia-sdk-${{ matrix.platform }}-${{ matrix.arch }}.zip
          retention-days: 14
